<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="ScanToBid">
  <!--
    Two lines, which is the whole product.

    Across the top: a dimension line with its end ticks — a true length, the
    thing a tape gives you and a scanner only estimates. Down the middle: a
    plumb line with the bob on the end — true vertical, the oldest measuring
    instrument there is and the only one that cannot drift. Together they read
    as a T.

    No text. Apple's icons are read at 60 px on a home screen, and a word at
    that size is a smudge.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2126"/>
      <stop offset="1" stop-color="#0E1215"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>

  <!-- Sized to fill the icon the way Apple's own do: the art carries its own
       margin, and the system supplies the rounded mask. -->
  <g transform="translate(512,512) scale(1.16) translate(-512,-512)">
  <g stroke="#F4F6F7" stroke-linecap="butt">
    <!-- the dimension line -->
    <line x1="224" y1="300" x2="800" y2="300" stroke-width="46"/>
    <!-- its end ticks -->
    <line x1="234" y1="234" x2="234" y2="366" stroke-width="24"/>
    <line x1="790" y1="234" x2="790" y2="366" stroke-width="24"/>
    <!-- the plumb line -->
    <line x1="512" y1="300" x2="512" y2="596" stroke-width="46"/>
  </g>

  <!-- the bob -->
  <polygon points="512,584 578,646 578,690 512,800 446,690 446,646" fill="#B8590A"/>
  </g>
</svg>
