<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="ScanToBid">
  <!--
    Three things the product does, in one drawing.

    The outer brackets are a scan reticle — what the phone frames before it
    reads a room. Inside it, a sheet with a gable: the bid and the building it
    is for are the same object here, because in this app they are produced in
    one act. Two ink rules are line items; the amber rule under them is the
    total, in the colour that means "measured" everywhere else in this product.

    No text. Apple's icons are read at 60 px on a home screen, and a word at
    that size is a smudge.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2126"/>
      <stop offset="1" stop-color="#0E1215"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>

  <!-- 68% of the square, the same fraction core/tools/gen-art.mjs uses, so the
       shipped icon and this file are the same picture at the same weight. -->
  <g transform="translate(512,512) scale(0.9751) translate(-512,-512)">
    <g fill="none" stroke="#F4F6F7" stroke-width="50" stroke-linecap="butt">
      <path d="M180 320 L180 180 L320 180"/>
      <path d="M704 180 L844 180 L844 320"/>
      <path d="M844 704 L844 844 L704 844"/>
      <path d="M320 844 L180 844 L180 704"/>
    </g>
    <path d="M336 448 L512 296 L688 448 L688 690 L336 690 Z"
          fill="none" stroke="#F4F6F7" stroke-width="36" stroke-linejoin="miter"/>
    <g fill="#F4F6F7">
      <rect x="396" y="494" width="232" height="30"/>
      <rect x="396" y="548" width="152" height="30"/>
    </g>
    <rect x="396" y="608" width="232" height="52" fill="#B8590A"/>
  </g>
</svg>
