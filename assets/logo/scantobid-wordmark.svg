<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 300" width="874" height="300"
     role="img" aria-label="ScanToBid">
  <!--
    The horizontal lockup: the mark, then the name, with `ToBid` in the amber
    that means "measured" everywhere else in this product — on the plan, on the
    field card, in the app.
  -->
  <g transform="translate(-11,0) scale(0.2896)">
    <g transform="translate(512,512) scale(1.16) translate(-512,-512)">
      <g stroke="#14181B" stroke-linecap="butt">
        <line x1="224" y1="300" x2="800" y2="300" stroke-width="46"/>
        <line x1="234" y1="234" x2="234" y2="366" stroke-width="24"/>
        <line x1="790" y1="234" x2="790" y2="366" stroke-width="24"/>
        <line x1="512" y1="300" x2="512" y2="596" stroke-width="46"/>
      </g>
      <polygon points="512,584 578,646 578,690 512,800 446,690 446,646" fill="#B8590A"/>
    </g>
  </g>
  <text x="285" y="205" font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-size="152" font-weight="bold" letter-spacing="-4" fill="#14181B">Scan<tspan fill="#B8590A">ToBid</tspan></text>
</svg>
