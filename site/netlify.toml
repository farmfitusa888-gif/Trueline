# The website. A separate Netlify site from the app's own deploy.
#
# `../netlify.toml` at the top of the repo publishes `web/dist` — the correction
# screens themselves, which are what the iPhone app loads. That is the product.
# This is the site about it.
#
# In Netlify: add a new site from the same repository, set the base directory to
# `site`, and everything below is picked up automatically.
[build]
  base = "site"
  command = "node build.mjs && node tools/check.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The checker is part of the build on purpose. A deploy that would ship a dead
# internal link, an unparseable piece of structured data or a guide nothing
# links to fails here rather than going live and being found by a crawler.

[[headers]]
  for = "/*"
  [headers.values]
    # Google Fonts is the only outside host this site touches, and it is named
    # rather than allowed by category. Everything else — scripts, images, styles
    # — is our own origin.
    # `media-src` is not decoration. A <video> is governed by it, and with
    # `default-src 'none'` and no media-src the two films would be blocked on
    # the live site while working perfectly on a local server -- the worst
    # possible shape of bug. `check.mjs` fails the build if a page gains a
    # <video> and this line does not mention media-src.
    #
    # The sha256 in script-src is the one inline script on this site: the six
    # lines in the <head> that apply a saved light or dark choice before the
    # first pixel is painted. It has to be inline -- a theme applied after first
    # paint is a white flash on every page load -- and with `script-src 'self'`
    # and nothing else the browser refused to run it, silently, on the live site
    # only. The site looked fine; the preference simply never applied and
    # nothing anywhere said why. Found by loading the built pages in a real
    # browser under this exact header (`tools/calc-browser.mjs`), and `check.mjs`
    # now hashes every inline script in `dist` and fails the build if the hash
    # is not named here -- so editing that script without updating this line
    # cannot ship.
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-S43fEebIkqS9QgDIhK2Mc83s5ERU7y489FJ58sHjQZI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The forms come with the HTML — `data-netlify="true"` on the sign-up form is
# all Netlify needs. Submissions land in the site's Forms tab; nothing is
# emailed anywhere until somebody sets that up.
