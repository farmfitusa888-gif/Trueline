# The Xcode project, generated rather than checked in.
#
# A .pbxproj is 700 lines of UUIDs that no human should edit and no reviewer can
# read, and it is the file most likely to conflict. This is the same project in
# 40 readable lines. `brew install xcodegen && xcodegen` in this directory
# produces Trueline.xcodeproj, and it can be deleted and regenerated at will.
name: Trueline
options:
  bundleIdPrefix: com.trueline
  deploymentTarget:
    iOS: "17.0"          # RoomCaptureSession.arSession is iOS 17 and later.
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Set this to your team in Xcode's Signing tab the first time; it is left
    # empty here so the file has nobody's account number in it.
    DEVELOPMENT_TEAM: ""

targets:
  Trueline:
    type: application
    platform: iOS
    sources:
      - path: Trueline
      # The built web app, copied in by the run script below. Everything after
      # the scan is these files.
      - path: Trueline/Web
        optional: true
        buildPhase: resources
    info:
      path: Trueline/Info.plist
      properties:
        CFBundleDisplayName: Trueline
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription:
          Trueline uses the camera to scan the room and to photograph it while you walk,
          so every dimension has a picture behind it. Nothing leaves this device.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: Build and copy the web app
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Xcode's PATH does not include Homebrew or nvm, so find node the way
          # a login shell would rather than assuming.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          ROOT="$SRCROOT/.."
          if ! command -v npm >/dev/null; then
            echo "warning: npm not found — using whatever is already in Trueline/Web"
            exit 0
          fi
          ( cd "$ROOT" && npm install --silent && npm run build --silent )
          rm -rf "$SRCROOT/Trueline/Web"
          mkdir -p "$SRCROOT/Trueline/Web"
          cp -R "$ROOT/web/dist/." "$SRCROOT/Trueline/Web/"
