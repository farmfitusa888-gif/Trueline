name: CI

# Private repositories are free and unlimited on GitHub. **Actions compute is
# not** — a free account gets 2,000 minutes a month, and this workflow was
# spending them three times over on every push: three jobs, each doing its own
# checkout, its own Node install and its own uncached `npm install`, for a
# repository whose entire test suite takes four seconds.
#
# So it is one job now, cached, and it does not run twice for the same work.
# Everything it does can also be run locally for nothing — `npm run verify`,
# which is what the pre-push hook in `core/tools/install-hooks.sh` calls. The
# minutes are for proving what landed on main, not for finding out whether the
# thing you are about to push compiles.

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes another cancels it rather than paying for both. The
# common case is three commits in a minute while somebody is iterating.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests, typecheck, build, and the shipped bundle
    runs-on: ubuntu-latest
    # The suite is seconds. A stuck runner should not quietly bill an hour.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Caches ~/.npm keyed on the lockfile, which is the difference
          # between a fresh download of every dependency and a few seconds.
          cache: npm

      # `ci` rather than `install`: it installs exactly the lockfile and does
      # not spend time resolving a tree that is already decided.
      - run: npm ci

      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      # No Xcode here, and none on the machine this project is written on, so
      # the project file is hand-edited and a hand-edited pbxproj is one typo
      # away from "the project file cannot be parsed" — which reads, on the
      # only Mac that matters, as the app being gone. This parses it and
      # resolves every object id in it.
      # There is no Swift compiler here and download.swift.org is refused by
      # the network policy, so this is a grammar rather than a compiler: it
      # says a file is not Swift, not that the code is wrong. Xcode is still
      # the first real compiler. It catches the whole class of damage a
      # scripted edit does, which is the class that was reaching the Mac.
      - name: The Swift parses
        run: |
          pip install --quiet tree_sitter tree_sitter_swift
          python3 core/tools/check-swift.py

      - name: The Xcode project file still parses
        run: python3 core/tools/check-pbxproj.py

      # The built web app is committed under ios/Trueline/Web so that a Mac
      # with no Node on it still produces a working app — the correction
      # screens are inside the phone app, and a missing bundle is a blank
      # screen. A committed artefact goes stale silently, so this proves it has
      # not: any difference means somebody changed a screen and did not ship it.
      - name: The bundle in the iOS app is the current build
        run: |
          if ! diff -r web/dist ios/Trueline/Web; then
            echo "::error::ios/Trueline/Web is not the current web build."
            echo "Run: npm run ship-web"
            exit 1
          fi
